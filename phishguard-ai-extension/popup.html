<!doctype html><html><head><meta charset="utf-8"><title>PhishGuard AI</title><style>
:root{color-scheme:dark}
body{width:330px;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111a24;color:#e8eef5}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #24313f;font-weight:600}
header .dot{width:9px;height:9px;border-radius:50%;background:#5eead4}
#body{padding:14px 16px 16px}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8ba0b4;margin-top:10px}
.host{font-family:ui-monospace,monospace;font-size:13px;margin-top:3px;word-break:break-all}
.verdict{margin-top:12px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.row{display:flex;justify-content:space-between;font-family:ui-monospace,monospace;font-size:12px;font-weight:700;color:var(--c);letter-spacing:.08em}
.track{height:6px;border-radius:99px;background:#1b2733;margin-top:8px;overflow:hidden}
.fill{height:100%;background:var(--c)}
.conf{font-size:10px;color:#8ba0b4;margin-top:6px;font-family:ui-monospace,monospace}
ul{list-style:none;padding:0;margin:6px 0 0}
li{font-size:12px;color:#c6d3e0;padding:5px 0;display:flex;gap:7px;align-items:baseline}
li b{color:#fbbf24}
li i{margin-left:auto;font-style:normal;font-family:ui-monospace,monospace;color:#f87171;font-size:11px}
details{margin-top:12px;font-size:12px}
summary{cursor:pointer;color:#5eead4;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #1d2934;font-size:11px;color:#8ba0b4}
.kv b{color:#e8eef5;font-family:ui-monospace,monospace;text-align:right;word-break:break-all}
.privacy{font-size:10px;color:#6f829a;line-height:1.5;margin:12px 0 0}
</style></head><body>
<header><span class="dot"></span>PhishGuard AI</header>
<div id="body">Analyzing page…</div>
<script src="popup.js" type="module"></script></body></html>
