<!doctype html><html><head><meta charset="utf-8"><title>Phishing website blocked — PhishGuard AI</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a0f12;color:#f3e9ea;font-family:system-ui,sans-serif}
.card{max-width:680px;padding:40px;border:1px solid rgba(248,113,113,.4);border-radius:18px;background:rgba(127,29,29,.18)}
h1{margin:0 0 8px;font-size:28px;color:#fca5a5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
.k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c9a3a6}
.v{font-family:ui-monospace,monospace;font-size:13px;margin-top:4px;word-break:break-all}
ul{padding-left:18px;line-height:1.8}
button{border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;margin-right:10px}
.safe{background:#34d399;color:#06281d}.ghost{background:transparent;color:#f3e9ea;border:1px solid rgba(255,255,255,.35)}
.warn{color:#fbbf24;margin-top:20px}
</style></head><body><div class="card">
<h1>🚨 Phishing website detected</h1>
<p>PhishGuard AI stopped this page before you could enter sensitive information.</p>
<div class="grid">
<div><div class="k">Impersonating</div><div class="v" id="brand">—</div></div>
<div><div class="k">Current website</div><div class="v" id="current">—</div></div>
<div><div class="k">Official website</div><div class="v" id="official">—</div></div>
</div>
<div class="k">Why we detected it</div><ul id="reasons"></ul>
<p class="warn">⚠ Do not enter your password, OTP, card details or other sensitive information.</p>
<button class="safe" onclick="history.back()">Go back to safety</button>
<button class="ghost" id="continue">Continue anyway</button>
</div>
<script>
const p = new URLSearchParams(location.search);
document.getElementById('brand').textContent = p.get('brand') || 'unknown';
document.getElementById('current').textContent = p.get('current') || '';
document.getElementById('official').textContent = p.get('official') || 'unknown';
(p.get('reasons') || '').split('|').filter(Boolean).forEach(r => {
  const li = document.createElement('li'); li.textContent = r; document.getElementById('reasons').appendChild(li);
});
document.getElementById('continue').onclick = () => { const t = p.get('target'); if (t) location.href = t; };
</script></body></html>
